spring.application.name=task-manager-backend
server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/task-manager;MODE=MYSQL;AUTO_SERVER=TRUE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

app.jwt.secret=${APP_JWT_SECRET:VGFza01hbmFnZXJMYWIxVG9rZW5TZWNyZXRLZXlGb3JDb3Vyc2VQcm9qZWN0MjAyNg==}
app.jwt.expiration-minutes=${APP_JWT_EXPIRATION_MINUTES:720}